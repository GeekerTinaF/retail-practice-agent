# Retail Practice — source registry
# Tier definitions follow .claude/skills/retail-research/evidence-policy.md §1.
# `last_used` = date a retail-research output actually cited the source.
#   null = listed for coverage only; not yet used or verified in an output.
# `countries` = ids from countries.yaml ("EU" = EU-wide, "EMEA" = multi-country).

version: 0.1
last_updated: 2026-09-28

tiers:
  1: Primary company sources and official statistics
  2: Strategic research and industry associations
  3: Trade press
  4: General business press
  5: Secondary commentary (leads only; never cited as standalone fact)

sources:
